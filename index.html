<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kannada Bill Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            /* Hide everything except the bill */
            body * {
                visibility: hidden !important;
            }

            #bill-preview,
            #bill-preview * {
                visibility: visible !important;
            }

            /* Force the bill to left half of A4 */
            #bill-preview {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 110mm !important;      /* Half of A4 width (210mm / 2) */
                height: 190mm !important;     /* Full A4 height */
                margin: 0 !important;
                padding: 8mm !important;      /* Internal spacing */
                background: white !important;
                overflow: visible !important;
                box-sizing: border-box !important;
                transform: scale(1) !important;
                transform-origin: top left !important;
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }

            /* Make the inner content fit properly */
            #bill-preview > div {
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 3mm !important;
                box-sizing: border-box !important;
                font-size: 8pt !important;
            }

            /* Adjust table sizes for half page */
            #bill-preview table {
                font-size: 7pt !important;
                width: 100% !important;
            }

            #bill-preview th,
            #bill-preview td {
                padding: 1mm !important;
                font-size: 7pt !important;
            }

            #bill-preview h1 {
                font-size: 12pt !important;
                margin: 2mm 0 !important;
            }

            #bill-preview h3 {
                font-size: 9pt !important;
                margin: 1mm 0 !important;
            }

            @page {
                size: A4 portrait;
                margin: 0;
            }

            html, body {
                width: 210mm !important;
                height: 297mm !important;
                background: white !important;
                overflow: hidden !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Remove all container styles */
            .min-h-screen, .p-4, .max-w-6xl, .bg-gradient-to-br, 
            .rounded-2xl, .shadow-2xl, .bg-white, .rounded-lg, .shadow-lg {
                margin: 0 !important;
                padding: 0 !important;
                min-height: auto !important;
                max-width: none !important;
                box-shadow: none !important;
                background: transparent !important;
                border-radius: 0 !important;
            }
        }
    </style>


</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function BillGenerator() {
            const [billData, setBillData] = useState({
                billNo: '#7189',
                billDate: new Date().toISOString().split('T')[0],
                vendorName: '',
                vendorAddress: '',
                vendorPhone: '',
                vendorLicense: '',
                customerName: '',
                customerAddress: '',
                place: 'NSSO Mysore',
                purity: '90 %',
                purchaseDate: '',
                billNumber: '6',
                expiryDate: '',
                invoiceNo: '432',
                type: 'ದ್ವಿ ತಳಿ (D.H)',
                billDateDetail: '',
                quantity: '190',
                balance: '40',
                totalAmount: '7600'
            });

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setBillData(prev => ({ ...prev, [name]: value }));
            };

            const generatePDF = () => {
                window.print();
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
                            {/* Header */}
                            <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white">
                                <h1 className="text-3xl font-bold text-center">ಶ್ರೀ ಮಹಾಲಕ್ಷ್ಮಿ ಚಾಕಿ ಸಾಕಾಣಿಕೆ ಕೇಂದ್ರ</h1>
                                <p className="text-center mt-2 text-blue-100">Bill Generator</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-6 p-6">
                                {/* Input Form */}
                                <div className="space-y-4">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-4">Enter Bill Details</h2>
                                    
                                    {/* Vendor Details */}
                                    <div className="bg-blue-50 p-4 rounded-lg">
                                        <h3 className="font-semibold text-lg mb-3 text-blue-900">ಸಿ.ಆರ್.ಸಿ ವಿವರ (Vendor Details)</h3>
                                        <input
                                            type="text"
                                            name="vendorName"
                                            placeholder="Vendor Name"
                                            value={billData.vendorName}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border rounded mb-2"
                                        />
                                        <input
                                            type="text"
                                            name="vendorAddress"
                                            placeholder="Address"
                                            value={billData.vendorAddress}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border rounded mb-2"
                                        />
                                        <input
                                            type="text"
                                            name="vendorPhone"
                                            placeholder="Phone Number"
                                            value={billData.vendorPhone}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border rounded mb-2"
                                        />
                                        <input
                                            type="text"
                                            name="vendorLicense"
                                            placeholder="License No."
                                            value={billData.vendorLicense}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border rounded"
                                        />
                                    </div>

                                    {/* Customer Details */}
                                    <div className="bg-green-50 p-4 rounded-lg">
                                        <h3 className="font-semibold text-lg mb-3 text-green-900">ರೆಶರ್ ವಿವರ (Customer Details)</h3>
                                        <input
                                            type="text"
                                            name="customerName"
                                            placeholder="Customer Name"
                                            value={billData.customerName}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border rounded mb-2"
                                        />
                                        <input
                                            type="text"
                                            name="customerAddress"
                                            placeholder="Customer Address"
                                            value={billData.customerAddress}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border rounded"
                                        />
                                    </div>

                                    {/* Product Details */}
                                    <div className="bg-yellow-50 p-4 rounded-lg">
                                        <h3 className="font-semibold text-lg mb-3 text-yellow-900">ಚಾಕಿ ವಿವರ (Product Details)</h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input
                                                type="text"
                                                name="place"
                                                placeholder="Place"
                                                value={billData.place}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                            <input
                                                type="text"
                                                name="purity"
                                                placeholder="Purity %"
                                                value={billData.purity}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                            <input
                                                type="date"
                                                name="purchaseDate"
                                                placeholder="Purchase Date"
                                                value={billData.purchaseDate}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                            <input
                                                type="text"
                                                name="billNumber"
                                                placeholder="Bill No."
                                                value={billData.billNumber}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                            <input
                                                type="date"
                                                name="expiryDate"
                                                placeholder="Expiry Date"
                                                value={billData.expiryDate}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded col-span-2"
                                            />
                                        </div>
                                    </div>

                                    {/* Bill Details */}
                                    <div className="bg-purple-50 p-4 rounded-lg">
                                        <h3 className="font-semibold text-lg mb-3 text-purple-900">ಬೆಳೆ ವಿವರ (the crop Details)</h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input
                                                type="text"
                                                name="invoiceNo"
                                                placeholder="Invoice No."
                                                value={billData.invoiceNo}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                            <input
                                                type="text"
                                                name="type"
                                                placeholder="Type"
                                                value={billData.type}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                            <input
                                                type="date"
                                                name="billDateDetail"
                                                placeholder="Bill Date"
                                                value={billData.billDateDetail}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                            <input
                                                type="text"
                                                name="quantity"
                                                placeholder="Quantity"
                                                value={billData.quantity}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                            <input
                                                type="text"
                                                name="balance"
                                                placeholder="Balance"
                                                value={billData.balance}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                            <input
                                                type="text"
                                                name="totalAmount"
                                                placeholder="Total Amount"
                                                value={billData.totalAmount}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border rounded"
                                            />
                                        </div>
                                    </div>

                                    <button
                                        onClick={generatePDF}
                                        className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-indigo-700 transition flex items-center justify-center gap-2"
                                    >
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                            <polyline points="7 10 12 15 17 10"></polyline>
                                            <line x1="12" y1="15" x2="12" y2="3"></line>
                                        </svg>
                                        Generate & Download PDF
                                    </button>
                                </div>

                                {/* Bill Preview */}
                                <div className="bg-gray-50 p-4 rounded-lg">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-4">Bill Preview</h2>
                                    <div id="bill-preview" className="bg-white p-6 rounded shadow-lg" style={{ fontFamily: 'Arial, sans-serif' }}>
                                        <div className="border-2 border-gray-800 p-4">
                                            {/* Header */}
                                            <div className="text-right text-sm mb-2">
                                                <div>ಬಿಲ್ಅಂಗ ದಿನಾಂಕ: {billData.billDate}</div>
                                            </div>

                                            <h1 className="text-center text-xl font-bold mb-4">ಶ್ರೀ ಮಹಾಲಕ್ಷ್ಮಿ ಚಾಕಿ ಸಾಕಾಣಿಕೆ ಕೇಂದ್ರ</h1>

                                            {/* Vendor & Customer Info */}
                                            <div className="grid grid-cols-2 gap-4 mb-4 text-sm">
                                                <div>
                                                    <div className="font-semibold">ಸಿ.ಆರ್.ಸಿ ವಿವರ</div>
                                                    <div>{billData.vendorName || 'ಚಂದನ ಬಿ. ಎಸ್'}</div>
                                                    <div>{billData.vendorAddress || 'ಸಾದರಹಳ್ಳಿ , ಲಕ್ಯಾ ಹೋಬಳಿ , ಚಿಕ್ಕಮಗಳೂರು ತಾಲ್ಲುಕು ಮತ್ತು ಜಿಲ್ಲೆ'}</div>
                                                    <div>{billData.vendorPhone || '7483873667, 8310217517'}</div>
                                                    <div className="text-xs">License: {billData.vendorLicense || 'KA/01/RCR/00827'}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-semibold">ರೈತರ ವಿವರ</div>
                                                    <div>{billData.customerName || 'ಅಣ್ಣೇಗೌಡ'}</div>
                                                    <div>{billData.customerAddress || 'ಸಾದರಹಳ್ಳಿ ಲಕ್ಯಾ ಹೋಬಳಿ'}</div>
                                                </div>
                                            </div>

                                            {/* Product Table */}
                                            <div className="mb-4">
                                                <h3 className="font-semibold mb-2">ಚಾಕಿ ವಿವರ</h3>
                                                <table className="w-full border border-gray-800 text-sm">
                                                    <thead>
                                                        <tr className="bg-gray-200">
                                                            <th className="border border-gray-800 p-1">ಮೂಲ</th>
                                                            <th className="border border-gray-800 p-1">ಚಾಕಿ ಶೇಕಡಾವಾರು</th>
                                                            <th className="border border-gray-800 p-1">ಬಿಡುಗಡೆ ದಿನಾಂಕ</th>
                                                            <th className="border border-gray-800 p-1">ಬೆಳೆ ಸಂಖ್ಯೆ.</th>
                                                            <th className="border border-gray-800 p-1">ವಿತರಣೆ ದಿನಾಂಕ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr className="text-center">
                                                            <td className="border border-gray-800 p-1">{billData.place}</td>
                                                            <td className="border border-gray-800 p-1">{billData.purity}</td>
                                                            <td className="border border-gray-800 p-1">{billData.purchaseDate || '06-05-2024'}</td>
                                                            <td className="border border-gray-800 p-1">{billData.billNumber}</td>
                                                            <td className="border border-gray-800 p-1">{billData.expiryDate || '24-05-2024'}</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>

                                            {/* Bill Details Table */}
                                            <div className="mb-4">
                                                <h3 className="font-semibold mb-2">ಬೆಳೆ ವಿವರ</h3>
                                                <table className="w-full border border-gray-800 text-sm">
                                                    <thead>
                                                        <tr className="bg-gray-200">
                                                            <th className="border border-gray-800 p-1">ಲಾಟ್ ಸಂಖ್ಯೆ.</th>
                                                            <th className="border border-gray-800 p-1">ತಳಿ</th>
                                                            <th className="border border-gray-800 p-1">ಚಾಕಿ ದಿನಾಂಕ</th>
                                                            <th className="border border-gray-800 p-1">ಮೊಟ್ಟೆ ಸಂಖ್ಯೆ.</th>
                                                            <th className="border border-gray-800 p-1">ಬಿಡಿ ಬೆಳೆ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr className="text-center">
                                                            <td className="border border-gray-800 p-1">{billData.invoiceNo}</td>
                                                            <td className="border border-gray-800 p-1">{billData.type}</td>
                                                            <td className="border border-gray-800 p-1">{billData.billDateDetail || '17-05-2024'}</td>
                                                            <td className="border border-gray-800 p-1">{billData.quantity}</td>
                                                            <td className="border border-gray-800 p-1">{billData.balance}</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>

                                            {/* Total */}
                                            <div className="text-right mb-4">
                                                <div className="font-semibold">ಒಟ್ಟು ಮೊತ್ತ</div>
                                                <div className="text-lg font-bold">Rs. {billData.totalAmount}</div>
                                                <hr className="mt-2 border-t border-gray-800" />
                                            </div>

                                            {/* Footer */}
                                            <div className="mt-8 text-sm">
                                                <div className="mb-2">ರೈತರ ಸಹಿ</div>
                                                <div className="text-right">
                                                    
                                                </div>
                                                
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<BillGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
