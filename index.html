<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B5E20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ಶ್ರೀ ಮಹಾಲಕ್ಷ್ಮಿ ಚಾಕಿ ಸಾಕಾಣಿಕೆ ಕೇಂದ್ರ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --green:#2E7D32;--green-light:#4CAF50;--green-dark:#1B5E20;
      --bg:#F1F8E9;--surface:#fff;--border:#C8E6C9;
      --text:#1f2937;--muted:#6b7280;
    }
    body{font-family:'Noto Sans Kannada',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}

    /* ── HEADER ── */
    .app-header{
      background:linear-gradient(135deg,var(--green-dark) 0%,var(--green) 100%);
      color:#fff;padding:8px 14px;
      display:flex;align-items:center;gap:12px;
      position:sticky;top:0;z-index:100;
      box-shadow:0 2px 12px rgba(27,94,32,.45);
    }
    .hdr-logo{
      width:58px;height:58px;border-radius:50%;
      border:2.5px solid rgba(255,255,255,.75);
      background:#fff;flex-shrink:0;object-fit:contain;padding:2px;
    }
    .hdr-text{flex:1}
    .hdr-text h1{font-size:15px;font-weight:800;line-height:1.3}
    .hdr-text p{font-size:10px;opacity:.85;letter-spacing:1px;margin-top:2px}

    /* ── MAIN ── */
    .main{max-width:820px;margin:0 auto;padding:14px 12px 100px}

    /* ── RECEIPT CARD ── */
    .receipt-card{background:var(--surface);border-radius:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);overflow:hidden;border:1.5px solid var(--border)}
    .card-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;background:linear-gradient(135deg,#E8F5E9 0%,#E3F2FD 100%);user-select:none}
    .card-hdr-left{display:flex;align-items:center;gap:8px}
    .card-badge{background:var(--green);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
    .card-hdr h3{font-size:14px;font-weight:700;color:var(--green-dark)}
    .card-hdr-right{display:flex;align-items:center;gap:8px}
    .card-arrow{font-size:16px;color:var(--green);transition:transform .2s}
    .card-hdr.closed .card-arrow{transform:rotate(-90deg)}
    .btn-remove{background:#FFEBEE;color:#C62828;border:1.5px solid #EF9A9A;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}

    .card-body{padding:14px}
    .card-body.hidden{display:none}

    /* ── FORM SECTIONS ── */
    .form-sec{border-radius:10px;padding:12px;margin-bottom:10px}
    .form-sec.farmer{background:#F1F8E9;border-left:4px solid var(--green)}
    .form-sec.seed  {background:#FFF8E1;border-left:4px solid #F9A825}
    .form-sec.crop  {background:#F3E5F5;border-left:4px solid #7B1FA2}
    .form-sec h4{font-size:13px;font-weight:700;margin-bottom:10px}
    .form-sec.farmer h4{color:var(--green-dark)}
    .form-sec.seed h4{color:#E65100}
    .form-sec.crop h4{color:#4A148C}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .field{display:flex;flex-direction:column;gap:3px}
    .field.full{grid-column:span 2}
    .field label{font-size:11px;font-weight:600;color:var(--muted)}
    .field input{padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);width:100%}
    .field input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(46,125,50,.12)}
    .field input.total{background:#F1F8E9;border-color:var(--green);font-weight:700;color:var(--green-dark)}

    /* ── ADD RECEIPT BUTTON ── */
    .add-wrap{text-align:center;padding:6px 0 10px}
    .btn-add{
      display:inline-flex;align-items:center;gap:8px;
      padding:13px 28px;
      background:linear-gradient(135deg,var(--green-dark),var(--green-light));
      color:#fff;border:none;border-radius:50px;
      font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
      box-shadow:0 4px 14px rgba(46,125,50,.4);
      transition:transform .15s,opacity .15s;
    }
    .btn-add:active{transform:scale(.96);opacity:.9}

    /* ── STICKY FOOTER ── */
    .sticky-footer{
      position:fixed;bottom:0;left:0;right:0;
      background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
      padding:10px 14px;box-shadow:0 -2px 16px rgba(0,0,0,.12);
      z-index:100;display:flex;gap:8px;
    }
    .btn-pdf{
      flex:2;padding:14px 16px;
      background:linear-gradient(135deg,var(--green-dark),var(--green));
      color:#fff;border:none;border-radius:12px;
      font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
      box-shadow:0 4px 12px rgba(27,94,32,.4);
    }
    .btn-pdf:disabled{opacity:.55;cursor:not-allowed}
    .btn-prev{
      flex:1;padding:14px 12px;background:#fff;
      color:var(--green-dark);border:2px solid var(--green);
      border-radius:12px;font-size:14px;font-weight:700;
      cursor:pointer;font-family:inherit;
    }

    /* ── OVERLAY ── */
    .overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:300;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .overlay.show{display:flex}
    .spinner{width:52px;height:52px;border:5px solid #E8F5E9;border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ov-text{font-size:16px;font-weight:700;color:var(--green-dark)}

    /* ── TOAST ── */
    .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:400;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
    .toast.show{opacity:1}

    /* ── MODAL ── */
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;overflow-y:auto;padding:16px 12px}
    .modal-bg.show{display:block}
    .modal-box{background:#fff;border-radius:16px;max-width:820px;margin:0 auto;overflow:hidden}
    .modal-top{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--green);color:#fff}
    .modal-top h3{font-size:15px;font-weight:700}
    .btn-close{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .modal-body{padding:12px;overflow-x:auto}

    /* ════════════════════════════════════════════
       PDF OUTPUT — A4 RECEIPT STYLES
    ════════════════════════════════════════════ */
    #pdf-out{
      position:absolute;left:-9999px;top:0;
      background:#fff;width:794px;
      font-family:'Noto Sans Kannada','Arial Unicode MS',Arial,sans-serif;
    }

    /* A4 page: exactly 794 x 1123 px — receipts fill the whole page */
    .a4{width:794px;height:1123px;background:#fff;padding:14px 16px;display:flex;flex-direction:column;overflow:hidden}

    /* RECEIPT BASE */
    .rcp{display:flex;flex-direction:column;flex:1;padding-bottom:10px;border-bottom:2.5px dashed #9E9E9E;margin-bottom:10px}
    .rcp:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
    .rcp-box{border:1.5px solid #374151;display:flex;flex-direction:column;flex:1}

    /* receipt header */
    .rcp-hd{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid #374151}
    .rcp-logo{border-radius:50%;object-fit:contain;flex-shrink:0}
    .rcp-title{flex:1;text-align:center}
    .rcp-title h2{font-weight:900;color:#111;line-height:1.2}
    .rcp-title p{color:#555}
    .rcp-dt{text-align:right;flex-shrink:0;white-space:nowrap;color:#333}

    /* parties */
    .rcp-pts{display:grid;grid-template-columns:1fr 1fr}
    .rcp-pt strong{display:block;font-weight:800;border-bottom:1px solid #e5e7eb}
    .rcp-pt.right{text-align:right}
    .rcp-pt div{line-height:1.5;color:#333}

    /* tables */
    .rcp-cap{font-weight:800;color:#111}
    .rcp-tbl{width:100%;border-collapse:collapse}
    .rcp-tbl th,.rcp-tbl td{border:1px solid #374151;text-align:center}
    .rcp-tbl th{background:#E8F5E9;font-weight:700}

    /* total */
    .rcp-tot{text-align:right;border-top:1.5px solid #374151;border-bottom:1.5px solid #374151}
    .rcp-tot strong{font-weight:900}

    /* signatures — 2 columns only; flex:1 fills all remaining height */
    .rcp-sigs{flex:1;display:flex;justify-content:space-between;align-items:stretch;padding-top:18px;gap:12px}
    .sig{text-align:center;flex:1;display:flex;flex-direction:column}
    .sig-r{flex:1.6}   /* CRC side wider — more room for seal/stamp */
    .sig .ln{border-top:1.5px solid #374151;flex:1;min-height:28px;margin-bottom:5px}

    /* ── SIZE: 1 RECEIPT on A4 (large) ── */
    .a4.c1 .rcp-box    {padding:14px}
    .a4.c1 .rcp-hd     {margin-bottom:12px;padding-bottom:10px}
    .a4.c1 .rcp-logo   {width:70px;height:70px}
    .a4.c1 .rcp-title h2{font-size:19px}
    .a4.c1 .rcp-title p {font-size:11px;margin-top:2px}
    .a4.c1 .rcp-dt      {font-size:13px}
    .a4.c1 .rcp-pts     {gap:12px;margin-bottom:14px}
    .a4.c1 .rcp-pt      {font-size:13px}
    .a4.c1 .rcp-pt strong{font-size:14px;margin-bottom:3px;padding-bottom:3px}
    .a4.c1 .rcp-cap     {font-size:12px;margin-bottom:4px}
    .a4.c1 .rcp-tbl-w   {margin-bottom:10px}
    .a4.c1 .rcp-tbl th,.a4.c1 .rcp-tbl td{font-size:11px;padding:5px 8px}
    .a4.c1 .rcp-tot     {font-size:14px;padding:6px 0;margin:10px 0}
    .a4.c1 .rcp-tot strong{font-size:19px}
    .a4.c1 .rcp-sigs    {font-size:12px}
    .a4.c1 .sig .ln     {min-height:60px}

    /* ── SIZE: 2 RECEIPTS on A4 ── */
    .a4.c2 .rcp        {padding-bottom:8px;margin-bottom:8px}
    .a4.c2 .rcp-box    {padding:10px}
    .a4.c2 .rcp-hd     {margin-bottom:8px;padding-bottom:7px}
    .a4.c2 .rcp-logo   {width:52px;height:52px}
    .a4.c2 .rcp-title h2{font-size:14px}
    .a4.c2 .rcp-title p {font-size:9px}
    .a4.c2 .rcp-dt      {font-size:11px}
    .a4.c2 .rcp-pts     {gap:8px;margin-bottom:8px}
    .a4.c2 .rcp-pt      {font-size:11px}
    .a4.c2 .rcp-pt strong{font-size:12px;margin-bottom:2px;padding-bottom:2px}
    .a4.c2 .rcp-cap     {font-size:10px;margin-bottom:2px}
    .a4.c2 .rcp-tbl-w   {margin-bottom:6px}
    .a4.c2 .rcp-tbl th,.a4.c2 .rcp-tbl td{font-size:9.5px;padding:3px 5px}
    .a4.c2 .rcp-tot     {font-size:12px;padding:4px 0;margin:6px 0}
    .a4.c2 .rcp-tot strong{font-size:15px}
    .a4.c2 .rcp-sigs    {font-size:10px}
    .a4.c2 .sig .ln     {min-height:30px}

    @media print{
      .app-header,.main,.sticky-footer,.modal-bg{display:none!important}
      #pdf-out{position:static;left:0;width:100%}
    }
  </style>
</head>
<body>

<header class="app-header">
  <img class="hdr-logo" id="hdr-logo" alt="Logo">
  <div class="hdr-text">
    <h1>ಶ್ರೀ ಮಹಾಲಕ್ಷ್ಮಿ ಚಾಕಿ ಸಾಕಾಣಿಕೆ ಕೇಂದ್ರ</h1>
    <p>SHRI MAHALAKSHMI CHAWKI REARING CENTRE</p>
  </div>
</header>

<main class="main">
  <div id="forms-con"></div>
  <div class="add-wrap" id="add-wrap"></div>
</main>

<div class="sticky-footer">
  <button class="btn-prev" onclick="showPrev()">👁 Preview</button>
  <button class="btn-pdf" id="gen-btn" onclick="genPDF()">📄 PDF Download ಮಾಡಿ</button>
</div>

<div class="overlay" id="loading">
  <div class="spinner"></div>
  <div class="ov-text">PDF ತಯಾರಿಸಲಾಗುತ್ತಿದೆ...</div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modal">
  <div class="modal-box">
    <div class="modal-top">
      <h3>ರಸೀದಿ Preview — A4 Layout</h3>
      <button class="btn-close" onclick="hidePrev()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="pdf-out"></div>

const VENDOR = {
  name:'ಚಂದನ ಬಿ. ಎಸ್',
  addr:'ಸಾದರಹಳ್ಳಿ, ಲಕ್ಯಾ ಹೋಬಳಿ, ಚಿಕ್ಕಮಗಳೂರು',
  phone:'7483873667 / 8310217517',
  lic:'KA/01/RCR/00827'
};

let count = 1;
const today = new Date().toISOString().split('T')[0];

function blank(){
  return {bd:today,fn:'',fa:'',src:'NSSO Mysore',pur:'90',pd:'',bn:'6',ed:'',inv:'432',typ:'ದ್ವಿ ತಳಿ (D.H)',cd:'',qty:'',rate:'',tot:''};
}
const R = [blank(),blank(),blank()];

/* ── SYNC: read DOM → R[] before PDF/preview ── */
function syncForms(){
  for(let i=0;i<count;i++){
    const g=(id)=>{const el=document.getElementById(id+i);return el?el.value:null;};
    const v=(id,def)=>{const x=g(id);return x!==null?x:def;};
    R[i].bd  =v('BD',R[i].bd);  R[i].fn =v('FN',R[i].fn);
    R[i].fa  =v('FA',R[i].fa);  R[i].src=v('SR',R[i].src);
    R[i].pur =v('PU',R[i].pur); R[i].pd =v('PD',R[i].pd);
    R[i].bn  =v('BN',R[i].bn);  R[i].ed =v('ED',R[i].ed);
    R[i].inv =v('IN',R[i].inv); R[i].typ=v('TY',R[i].typ);
    R[i].cd  =v('CD',R[i].cd);  R[i].qty=v('QT',R[i].qty);
    R[i].rate=v('RT',R[i].rate);R[i].tot=v('TT',R[i].tot);
  }
}

function updateAddBtn(){
  const w=document.getElementById('add-wrap');
  if(count===1) w.innerHTML='<button class="btn-add" onclick="addRcp()">➕ 2ನೇ ರಸೀದಿ ಸೇರಿಸಿ</button>';
  else w.innerHTML='';
}

/* ── ADD / REMOVE ── */
function addRcp(){
  if(count>=2)return;
  // Append only the NEW receipt card — do NOT destroy existing ones
  document.getElementById('forms-con').appendChild(mkForm(count));
  count++;
  updateAddBtn();
}
function delRcp(i){
  syncForms(); // capture current DOM values first
  for(let k=i;k<2;k++) R[k]=Object.assign({},R[k+1]);
  R[2]=blank();
  count--;
  render();
}

/* ── RENDER ── */
function render(){
  const c=document.getElementById('forms-con');
  c.innerHTML='';
  for(let i=0;i<count;i++) c.appendChild(mkForm(i));
  updateAddBtn();
}

function inp(t,id,v,ph,cls){
  return '<input type="'+t+'" id="'+id+'" value="'+(v||'')+'" placeholder="'+(ph||'')+'"'+(cls?' class="'+cls+'"':'')+' autocomplete="off">';
}

function mkForm(i){
  const r=R[i];
  const card=document.createElement('div');
  card.className='receipt-card';
  card.id='cd-'+i;
  const rmBtn=i>0?'<button class="btn-remove" onclick="event.stopPropagation();delRcp('+i+')">✕ ತೆಗೆ</button>':'';
  card.innerHTML=
    '<div class="card-hdr'+(i>0?' closed':'')+'" id="hdr-'+i+'" onclick="tog('+i+')">'
      +'<div class="card-hdr-left"><div class="card-badge">'+(i+1)+'</div>'
      +'<h3>ರಸೀದಿ '+(i+1)+(i===0?' ✏️':'')+'</h3></div>'
      +'<div class="card-hdr-right">'+rmBtn+'<span class="card-arrow">▼</span></div>'
    +'</div>'
    +'<div class="card-body'+(i>0?' hidden':'')+'" id="bd-'+i+'">'
      +'<div class="field" style="margin-bottom:12px"><label>ದಿನಾಂಕ (Date)</label>'+inp('date','BD'+i,r.bd)+'</div>'
      +'<div class="form-sec farmer"><h4>👨‍🌾 ರೈತರ ವಿವರ — Farmer Details</h4>'
        +'<div class="form-grid">'
          +'<div class="field full"><label>ರೈತರ ಹೆಸರು (Farmer Name)</label>'+inp('text','FN'+i,r.fn,'ಹೆಸರು ನಮೂದಿಸಿ...')+'</div>'
          +'<div class="field full"><label>ವಿಳಾಸ (Address)</label>'+inp('text','FA'+i,r.fa,'ವಿಳಾಸ ನಮೂದಿಸಿ...')+'</div>'
        +'</div></div>'
      +'<div class="form-sec seed"><h4>🌱 ಚಾಕಿ ವಿವರ — Seed Details</h4>'
        +'<div class="form-grid">'
          +'<div class="field"><label>ಮೂಲ (Source)</label>'+inp('text','SR'+i,r.src,'NSSO Mysore')+'</div>'
          +'<div class="field"><label>ಚಾಕಿ ಶೇಕಡಾವಾರು</label>'+inp('text','PU'+i,r.pur,'90')+'</div>'
          +'<div class="field"><label>ಬಿಡುಗಡೆ ದಿನಾಂಕ</label>'+inp('date','PD'+i,r.pd)+'</div>'
          +'<div class="field"><label>ಬೆಳೆ ಸಂಖ್ಯೆ.</label>'+inp('text','BN'+i,r.bn,'6')+'</div>'
          +'<div class="field full"><label>ವಿತರಣೆ ದಿನಾಂಕ</label>'+inp('date','ED'+i,r.ed)+'</div>'
        +'</div></div>'
      +'<div class="form-sec crop"><h4>🌾 ಬೆಳೆ ವಿವರ — Crop / Bill Details</h4>'
        +'<div class="form-grid">'
          +'<div class="field"><label>ಲಾಟ್ ಸಂಖ್ಯೆ.</label>'+inp('text','IN'+i,r.inv,'432')+'</div>'
          +'<div class="field"><label>ತಳಿ</label>'+inp('text','TY'+i,r.typ,'ದ್ವಿ ತಳಿ (D.H)')+'</div>'
          +'<div class="field full"><label>ದಿನಾಂಕ (Bill Date)</label>'+inp('date','CD'+i,r.cd)+'</div>'
          +'<div class="field"><label>ಮೊಟ್ಟೆ ಸಂಖ್ಯೆ.</label>'+inp('number','QT'+i,r.qty,'190')+'</div>'
          +'<div class="field"><label>ಬಿಡಿ ಬೆಳೆ (₹)</label>'+inp('number','RT'+i,r.rate,'40')+'</div>'
          +'<div class="field full"><label>ಒಟ್ಟು ಮೊತ್ತ — Total Amount (₹)</label>'+inp('number','TT'+i,r.tot,'7600','total')+'</div>'
        +'</div></div>'
    +'</div>';

  const b=card.querySelector('#bd-'+i);
  function bnd(id,key){
    const el=b.querySelector('#'+id);
    if(!el)return;
    ['input','change'].forEach(ev=>el.addEventListener(ev,e=>{R[i][key]=e.target.value;}));
  }
  bnd('BD'+i,'bd');bnd('FN'+i,'fn');bnd('FA'+i,'fa');bnd('SR'+i,'src');bnd('PU'+i,'pur');
  bnd('PD'+i,'pd');bnd('BN'+i,'bn');bnd('ED'+i,'ed');bnd('IN'+i,'inv');bnd('TY'+i,'typ');bnd('CD'+i,'cd');
  const qe=b.querySelector('#QT'+i), re=b.querySelector('#RT'+i), te=b.querySelector('#TT'+i);
  function calc(){
    const q=parseFloat(R[i].qty)||0,rt=parseFloat(R[i].rate)||0;
    if(q>0&&rt>0){R[i].tot=String(Math.round(q*rt));te.value=R[i].tot;}
  }
  ['input','change'].forEach(ev=>{
    qe.addEventListener(ev,e=>{R[i].qty=e.target.value;calc();});
    re.addEventListener(ev,e=>{R[i].rate=e.target.value;calc();});
  });
  te.addEventListener('input',e=>R[i].tot=e.target.value);
  return card;
}

function tog(i){
  document.getElementById('hdr-'+i).classList.toggle('closed');
  document.getElementById('bd-'+i).classList.toggle('hidden');
}

function fd(d){if(!d)return'';const p=d.split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:d;}

  let h='';for(let i=0;i<count;i++)h+=rcpHTML(i);

}

/* ── PREVIEW ── */
function showPrev(){
  syncForms();
  const mb=document.getElementById('modal-body');
  mb.innerHTML='<div style="transform:scale(0.48);transform-origin:top left;width:794px;min-height:200px">'+pageHTML()+'</div>';
  document.getElementById('modal').classList.add('show');
}
function hidePrev(){document.getElementById('modal').classList.remove('show');}

/* ── PDF ── */
async function genPDF(){
  syncForms(); // always read latest DOM values before generating
  const btn=document.getElementById('gen-btn');
  const ld=document.getElementById('loading');
  btn.disabled=true;ld.classList.add('show');
  try{
    const out=document.getElementById('pdf-out');
    out.innerHTML=pageHTML();
    await document.fonts.ready;
    await new Promise(r=>setTimeout(r,500));
    const canvas=await html2canvas(out,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,allowTaint:true});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth();
    const ph=pdf.internal.pageSize.getHeight();
    const img=canvas.toDataURL('image/jpeg',0.95);
    const ih=(canvas.height*pw)/canvas.width;
    if(ih<=ph){
      pdf.addImage(img,'JPEG',0,0,pw,ih);
    } else {
      // Scale to fit single A4 page
      const sw=(canvas.width*ph)/canvas.height;
      pdf.addImage(img,'JPEG',(pw-sw)/2,0,sw,ph);
    }
    const fname='bills_'+today.replace(/-/g,'')+'_'+Date.now()+'.pdf';
    if(window.AndroidInterface){
      const b64=pdf.output('datauristring').split(',')[1];
      window.AndroidInterface.savePDF(b64,fname);
      toast('✅ PDF Downloads ಫೋಲ್ಡರ್‌ಗೆ ಉಳಿಸಲಾಗಿದೆ!');
    } else {
      pdf.save(fname);
      toast('✅ PDF ಯಶಸ್ವಿಯಾಗಿ ಡೌನ್‌ಲೋಡ್ ಆಗಿದೆ!');
    }
  }catch(err){
    console.error(err);
    toast('❌ ದೋಷ ಸಂಭವಿಸಿದೆ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.');
  }finally{
    btn.disabled=false;ld.classList.remove('show');
  }
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('hdr-logo').src=LOGO;
  render();
});
</script>
